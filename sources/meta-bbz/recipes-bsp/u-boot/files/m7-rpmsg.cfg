# Boot the device tree that hands the Cortex-M7 its resources (RPMsg vrings and buffers,
# remoteproc node, UART4, audio). Linux then starts M7 firmware via remoteproc.
CONFIG_DEFAULT_FDT_FILE="imx8mp-frdm-rpmsg.dtb"
# Before every boot, set mcore_clk; mmcargs puts it on the kernel command line.
# - clk-imx8mp.mcore_booted: Linux leaves the gates of M7-side clocks alone
# - clk_ignore_unused: Linux doesn't switch off clocks it isn't using itself; the M7's
#   peripherals (e.g. UART4) have no Linux user. Tested on this board: without these
#   arguments, starting M7 firmware froze the whole SoC; with both, start/stop and RPMsg
#   work. Cost: a little power.
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="setenv mcore_clk clk-imx8mp.mcore_booted clk_ignore_unused"
