# Cortex-M7 start and protection (see docs/M7_A53_ARCHITECTURE.md)
CONFIG_CMD_SMC=y
# preboot (every start, before the autoboot countdown): NXP's prepare_mcore (kernel argument
# clk-imx8mp.mcore_booted), then load bbz-m7-boot.bin from the boot partition into ITCM and
# start the M7. The M7 runs before Linux, also when autoboot is stopped.
CONFIG_PREBOOT="run prepare_mcore; if fatload mmc ${mmcdev}:${mmcpart} 0x48000000 bbz-m7-boot.bin; then cp.b 0x48000000 0x7e0000 0x20000; bootaux 0x7e0000; fi"
# bootcmd: right before booting, protect the M7 with TF-A SiP calls (patch in recipes-bsp/imx-atf).
# U-Boot parses numbers as hex: region 0x16 = 22, 0x27 = 39.
#  RDC region 22 (M7 TCM):  0x7e0000-0x81f000 (A53 view: ITCM + DTCM except the last 4 KB, the
#                           shared heartbeat page)
#  RDC region 39 (DRAM):    0x80000000-0x81000000, encoded (addr - 0x40000000) / 2
#  MRC 0xc000000e:          LCK | ENA | M7 (domain 1) read+write | A53 (domain 0) read only
#  then lock: no more changes, no M7 stop/start from Linux, SRC_M7RCR writable by the M7 only
# Tested at the U-Boot prompt: with these values A53 writes are dropped (no bus error).
CONFIG_BOOTCOMMAND="smc 0xc20000b0 0x16 0x7e0000 0x81f000 0xc000000e; smc 0xc20000b0 0x27 0x20000000 0x20800000 0xc000000e; smc 0xc20000b1; run sr_ir_v2_cmd;bootflow scan -lb; run bsp_bootcmd"
