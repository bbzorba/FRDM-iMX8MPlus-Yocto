# Hardware watchdog for the A53 side (WDOG1, /dev/watchdog0).
# systemd (PID 1) arms it at boot and pets it every RuntimeWatchdogSec/2. If the kernel hangs
# (or the whole SoC freezes, e.g. a core stalls the bus), nobody pets it: after 30 s WDOG1
# drives WDOG_B low and the PMIC cold-resets the board, A53s and M7 together.
# RebootWatchdogSec: a reboot or poweroff that gets stuck is forced after 2 min.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
