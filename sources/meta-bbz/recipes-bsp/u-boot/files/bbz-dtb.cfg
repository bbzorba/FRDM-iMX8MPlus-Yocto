# Boot our device tree, imx8mp-bbz.dtb (Linux on the A53s + Cortex-M7 via remoteproc/RPMsg).
CONFIG_DEFAULT_FDT_FILE="imx8mp-bbz.dtb"
# Before every boot run NXP's prepare_mcore: mcore_clk=clk-imx8mp.mcore_booted, which mmcargs
# puts on the kernel command line. Linux then leaves the gates of the SoC's root clocks alone.
# Tested on this board: without it, starting M7 firmware froze the whole SoC (the watchdog
# reset it), even with the M7 peripherals' clocks in init-on-array.
CONFIG_USE_PREBOOT=y
# (CONFIG_PREBOOT itself is in bbz-m7.cfg: prepare_mcore + starting the M7)
