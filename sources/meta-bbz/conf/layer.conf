# meta-bbz: custom layer for an i.MX 8M Plus image.
#
# layer.conf is parsed by BitBake when this layer appears in build/conf/bblayers.conf.
# It tells BitBake where to find recipes (.bb) and appends (.bbappend) in this layer.

# LAYERDIR is the absolute path of this layer; append it to BBPATH so BitBake
# can find classes/ and conf/ files that live here.
BBPATH .= ":${LAYERDIR}"

# Every recipe and bbappend under recipes-*/<anything>/ gets picked up.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "bbz"
BBFILE_PATTERN_bbz = "^${LAYERDIR}/"
# Priority decides which layer wins if two layers provide the same recipe.
# NXP's meta-imx layers use 8-ish; going above them makes our appends/overrides win.
BBFILE_PRIORITY_bbz = "12"

# Layers we need to be present (by their BBFILE_COLLECTIONS name).
LAYERDEPENDS_bbz = "core openembedded-layer networking-layer"

# Which Yocto release series this layer is written for (6.0 = wrynose).
LAYERSERIES_COMPAT_bbz = "wrynose"

# Our own applications live in the same repository, two levels up: <repo>/apps/<name>.
# ':=' expands now, while LAYERDIR is still set (it is only valid while parsing this file).
BBZ_APPS_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', '..', 'apps'))}"
