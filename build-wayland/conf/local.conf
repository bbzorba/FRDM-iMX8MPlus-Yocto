DISTRO ?= 'fsl-imx-wayland'
# The board is the FRDM-IMX8MPLUS (4 GB LPDDR4), not the 8M Plus EVK
MACHINE ??= 'imx8mp-lpddr4-frdm'
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
CONF_VERSION = "2"

DL_DIR ?= "${BSPDIR}/downloads/"
ACCEPT_FSL_EULA = "1"

# Switch to Debian packaging and include package-management in the image
PACKAGE_CLASSES = "package_deb"
EXTRA_IMAGE_FEATURES += "package-management"

# ---- Host-safety limits (i7-9700K, 8 cores / 32 GB RAM / 4 GB swap) ----
# The default (8 tasks x make -j8 = up to 64 compilers) froze the PC by running out of RAM.
# Worst case now: 4 tasks x 4 jobs = 16 compilers.
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 4"

# Recipes whose compile/link steps need several GB of RAM per job
PARALLEL_MAKE:pn-llvm-native = "-j 3"
PARALLEL_MAKE:pn-llvm = "-j 3"
PARALLEL_MAKE:pn-clang-native = "-j 3"
PARALLEL_MAKE:pn-nodejs = "-j 3"
PARALLEL_MAKE:pn-nodejs-native = "-j 3"

# Don't START new tasks while the kernel reports memory stalls (swapping/reclaim)
# above 1% of the time (units: microseconds of stall per second, from /proc/pressure/memory).
BB_PRESSURE_MAX_MEMORY = "10000"

# Compression tools (xz/zstd for packages and sstate) default to all cores and lots of RAM
XZ_THREADS = "4"
ZSTD_THREADS = "4"

# Delete each recipe's work dir once it's built (saves the majority of disk space).
# To keep a recipe's build tree for inspection: RM_WORK_EXCLUDE += "hello-bbz"
INHERIT += "rm_work"
