# Serial console: show only kernel errors (levels 0-3) from early boot on.
# NXP's Wi-Fi driver logs every background scan (wpa_supplicant/NetworkManager scan every
# 30-300 s for roaming) at notice/warn level, which filled the J19 console. Everything still
# goes to dmesg and the journal; real Wi-Fi faults (cmd53 write error, ...) are errors and
# still reach the console. Show more for debugging: dmesg -n 8
kernel.printk = 4 4 1 7
