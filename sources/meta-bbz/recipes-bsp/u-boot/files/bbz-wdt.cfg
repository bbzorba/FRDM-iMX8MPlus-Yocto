# Arm WDOG1 already in U-Boot (60 s). U-Boot feeds it in the background (cyclic) while it runs,
# also at the prompt and during fastboot flashing; Linux's imx2_wdt keeps feeding it until systemd
# takes over. If anything freezes the whole SoC before that (seen: an M7 firmware stalling the
# bus during U-Boot), WDOG_B makes the PMIC reset the board instead of it hanging forever.
CONFIG_WDT=y
# CONFIG_WATCHDOG is what makes U-Boot feed it (without it: "started without servicing",
# and an idle U-Boot prompt or a long fastboot flash was reset after 60 s)
CONFIG_WATCHDOG=y
CONFIG_IMX_WATCHDOG=y
CONFIG_WATCHDOG_AUTOSTART=y
CONFIG_WATCHDOG_TIMEOUT_MSECS=60000
CONFIG_CMD_WDT=y
